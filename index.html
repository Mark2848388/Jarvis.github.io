<style>
:root{--bg:#262624;--panel:#1f1f1d;--card:#30302e;--user:#3a3935;--tx:#ece9e1;--mu:#9a968b;--ac:#d97757;--bd:#403f3a;--ok:#7fb37f;--er:#e57373;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;border-bottom:1px solid var(--bd)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--mu)}.ib:active{background:var(--card)}
header h1{flex:1;margin:0;font:600 19px var(--serif);letter-spacing:.01em}
.beta{font:700 10px system-ui;letter-spacing:.1em;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:1px 5px;vertical-align:middle;margin-left:4px}
#pill{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--tx)}
#dot{width:8px;height:8px;border-radius:50%;background:var(--mu);display:inline-block;margin-right:6px}#dot.on{background:var(--ok)}
main{flex:1;overflow-y:auto;scroll-behavior:smooth}#wrap{max-width:740px;margin:0 auto;padding:16px 14px 8px}
.msg{margin:14px 0;animation:in .2s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.u{display:flex;justify-content:flex-end}.u .b{background:var(--user);padding:9px 14px;border-radius:18px 18px 4px 18px;max-width:86%;white-space:pre-wrap;word-break:break-word}
.a .b{font:17px/1.65 var(--serif);word-break:break-word}.a .who{font-size:12px;color:var(--ac);letter-spacing:.08em;margin-bottom:2px}
.a .b p{margin:0 0 .7em}.a code{background:var(--panel);padding:1px 6px;border-radius:6px;font:14px ui-monospace,Menlo,monospace}
.a pre{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:12px;overflow:auto;font:13px/1.5 ui-monospace,Menlo,monospace;margin:.6em 0}.a pre code{background:none;padding:0}
.act{display:flex;gap:2px;margin-top:4px}.act button{font-size:12px;color:var(--mu);padding:4px 8px;border-radius:8px}.act button:active{background:var(--card)}
.err .b{color:var(--er);font:15px system-ui}.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--mu);animation:bl 1.2s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}

.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chips button{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px 14px;font-size:14px}
footer{padding:8px 12px calc(env(safe-area-inset-bottom) + 10px)}
#box{max-width:740px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:24px;display:flex;align-items:flex-end;padding:6px 6px 6px 16px}
#box:focus-within{border-color:#5a5851}#in{flex:1;background:none;border:0;outline:0;resize:none;max-height:160px;padding:8px 0;line-height:1.4}

#hint{text-align:center;font-size:11px;color:var(--mu);margin-top:6px}
/* drawer + sheet */
#shade{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.2s;z-index:5}#shade.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--panel);border-right:1px solid var(--bd);transform:translateX(-100%);transition:.25s;z-index:6;padding:calc(env(safe-area-inset-top) + 14px) 12px;display:flex;flex-direction:column;gap:4px}#drawer.on{transform:none}
#drawer h3{font:600 22px var(--serif);margin:4px 8px 12px}#drawer button{text-align:left;padding:12px;border-radius:12px;font-size:16px}#drawer button:active{background:var(--card)}
#drawer .sp{flex:1}#drawer small{color:var(--mu);padding:8px;font-size:12px}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--panel);border-radius:22px 22px 0 0;border:1px solid var(--bd);transform:translateY(105%);transition:.25s;z-index:7;display:flex;flex-direction:column}#sheet.on{transform:none}
#sh{display:flex;align-items:center;padding:14px 16px 6px}#sh b{flex:1;font:600 18px var(--serif)}#sb{overflow:auto;padding:6px 16px calc(env(safe-area-inset-bottom) + 18px)}
.f{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;outline:0;margin:4px 0}.btn{background:var(--ac);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;margin:6px 6px 0 0}.btn.g{background:var(--user)}
.row{display:flex;gap:8px}.row>.f{flex:1;min-width:0}.item{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}.item span{flex:1}.item button{color:var(--mu);padding:0 6px}
.mode{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--bd);border-radius:12px;margin:6px 0;background:var(--card)}.mode.on{border-color:var(--ac)}.mode small{display:block;color:var(--mu)}
pre.o{background:var(--bg);border-radius:10px;padding:10px;white-space:pre-wrap;font:13px ui-monospace,monospace;margin:8px 0 0;max-height:30vh;overflow:auto}.mu{color:var(--mu);font-size:13px}

<script>
const $=i=>document.getElementById(i),V=Vektor;let busy=false,chat=JSON.parse(localStorage.getItem('vk_chat')||'[]'),MODES={};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(src){
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const inline=s=>{let t=esc(s),stash=[];const hold=x=>{let k='@@H'+stash.length+'@@';stash.push(x);return k};
    t=t.replace(/`([^`]+)`/g,(_,x)=>hold('<code>'+x+'</code>'));
    t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,a,u)=>hold('<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+a+'</a>'));
    t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/__(.+?)__/g,'<strong>$1</strong>');
    t=t.replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>');
    return t.replace(/@@H(\d+)@@/g,(_,i)=>stash[+i])};
  const lines=String(src??'').replace(/\r\n?/g,'\n').split('\n'),out=[];let i=0,para=[],list=null,code=null;
  const flush=()=>{if(para.length){out.push('<p>'+para.map(inline).join('<br>')+'</p>');para=[]}};
  const close=()=>{if(list){out.push('</'+list+'>');list=null}};
  const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
  const sep=l=>/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(l);
  while(i<lines.length){let l=lines[i];
    if(code!==null){if(/^```\s*$/.test(l)){out.push(esc(code.join('\n'))+'</code></pre>');code=null}else code.push(l);i++;continue}
    const fence=l.match(/^```([\w.+-]*)\s*$/);if(fence){flush();close();code=[];out.push('<pre><code>');i++;continue}
    if(!l.trim()){flush();close();i++;continue}
    if(i+1<lines.length&&l.includes('|')&&sep(lines[i+1])){flush();close();const h=cells(l);i+=2;let rows=[];
      while(i<lines.length&&lines[i].includes('|')&&lines[i].trim())rows.push(cells(lines[i++]));
      out.push('<table><thead><tr>'+h.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+h.map((_,j)=>'<td>'+inline(r[j]??'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue}
    const h=l.match(/^(#{1,6})\s+(.+)$/);if(h){flush();close();let n=h[1].length;out.push('<h'+n+'>'+inline(h[2])+'</h'+n+'>');i++;continue}
    if(/^(-{3,}|\*{3,})\s*$/.test(l)){flush();close();out.push('<hr>');i++;continue}
    if(/^\s*>\s?/.test(l)){flush();close();let q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i]))q.push(inline(lines[i++].replace(/^\s*>\s?/,'')));out.push('<blockquote>'+q.join('<br>')+'</blockquote>');continue}
    const li=l.match(/^\s*[-+*]\s+(.+)$/),oi=l.match(/^\s*\d+[.)]\s+(.+)$/);if(li||oi){flush();let typ=li?'ul':'ol';if(list!==typ){close();list=typ;out.push('<'+typ+'>')}out.push('<li>'+inline((li||oi)[1])+'</li>');i++;continue}
    close();para.push(l);i++;
  }
  flush();close();if(code!==null)out.push(esc(code.join('\n'))+'</code></pre>');return out.join('');
}
function add(role,text,cls='',meta=null){$('empty').style.display='none';const d=document.createElement('div');d.className='msg '+(role==='user'?'u':'a')+' '+cls;
  d.innerHTML=role==='user'?'<div class="b"></div>':'<div class="who">VEKTOR</div><div class="b"></div>';const b=d.querySelector('.b');
  if(role==='user')b.textContent=text;else if(text==null)b.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';else b.innerHTML=md(text);if(role!=='user'&&meta){const m=document.createElement('div');m.className='meta';m.textContent='⏱ '+(meta.elapsed_ms/1000).toFixed(2)+' сек · '+(meta.activity||'Готово')+' · '+(meta.provider||'VEKTOR');d.append(m)}
